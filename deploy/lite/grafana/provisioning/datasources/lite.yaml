# LITE dashboards' datasources: the gateway's Postgres (usage_events) and Prometheus (/metrics).
# The uids are the ones the dashboards in dashboard/dashboards name. Every value comes from the
# Grafana container's environment, so another Grafana (an org's own, or the agentic framework's)
# can mount this file unchanged and set:
#   LITE_DB_HOST (host:port), LITE_DB_NAME, LITE_DB_USER, LITE_DB_PASSWORD, LITE_PROMETHEUS_URL
apiVersion: 1

datasources:
  - name: TokenLean Postgres
    type: postgres
    uid: app-postgres
    url: ${LITE_DB_HOST}
    database: ${LITE_DB_NAME}
    user: ${LITE_DB_USER}
    secureJsonData:
      password: ${LITE_DB_PASSWORD}
    jsonData:
      sslmode: ${LITE_DB_SSLMODE}
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: false

  - name: TokenLean Prometheus
    type: prometheus
    uid: prometheus
    url: ${LITE_PROMETHEUS_URL}
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST
