{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not .Values.metrics.existingSecret }}
{{- fail "metrics.serviceMonitor needs metrics.existingSecret: /metrics answers only to the scrape token" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tokenlean-lite.fullname" . }}
  labels:
    {{- include "tokenlean-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "tokenlean-lite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.metrics.existingSecret }}
          key: {{ .Values.metrics.scrapeTokenSecretKey }}
{{- end }}
